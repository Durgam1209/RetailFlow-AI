name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install ML dependencies
        run: python -m pip install -r ml_pipeline/requirements-dev.txt
      - name: Lint ML pipeline
        run: python -m ruff check ml_pipeline
      - name: Test ML pipeline
        run: python -m pytest ml_pipeline/tests
      - name: Scan repository history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        with:
          args: git --redact --config .gitleaks.toml .

  flutter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: murali_fruits_ml
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: murali_fruits_ml
        run: flutter analyze --fatal-infos
      - name: Run Flutter tests
        working-directory: murali_fruits_ml
        run: flutter test
      - name: Build Flutter web app
        working-directory: murali_fruits_ml
        run: flutter build web --release
