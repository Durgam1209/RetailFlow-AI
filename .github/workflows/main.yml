name: RetailFlow AI 

on:
  schedule:
    - cron: '0 18 * * *' # Runs daily at 11:30 PM IST (6 PM UTC)
  push:
    branches: [ main ] # Runs every time you push code
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  run-ml-logic:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Explicitly allow pushing back to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Fetches your code

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Matches your local environment

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_pipeline/requirements.txt # Installs prophet, mlxtend, etc.

      - name: Run Data Enrichment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
        run: python ml_pipeline/enrich_data.py # Pulls sales and adds weather/holidays

      - name: Run ML Intelligence Orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python ml_pipeline/main.py # Generates forecast and bundles

      - name: Commit Updated Data and Logs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      
          # Only add if file actually exists
          [ -f ml_pipeline/data/processed/master_training_data.csv ] && git add -f ml_pipeline/data/processed/master_training_data.csv
          [ -f ml_pipeline/logs/performance_history.csv ] && git add -f ml_pipeline/logs/performance_history.csv
      
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "Automated Sync & Performance Log: $(date +'%Y-%m-%d')"
          git push
